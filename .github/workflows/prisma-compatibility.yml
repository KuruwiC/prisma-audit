name: Prisma Version Compatibility

on:
  push:
    branches: [main, draft]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

jobs:
  compatibility:
    name: Prisma ${{ matrix.prisma }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        prisma:
          - "6.16.0"
          - "6.19.3"
          - "7.0.0"
          - "7.10.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Override Prisma version
        run: |
          node scripts/sync-datasource-url.mjs ${{ matrix.prisma }}
          pnpm pkg set \
            pnpm.overrides.prisma=${{ matrix.prisma }} \
            pnpm.overrides.@prisma/client=${{ matrix.prisma }} \
            pnpm.overrides.@prisma/adapter-pg=${{ matrix.prisma }} \
            pnpm.overrides.@prisma/adapter-better-sqlite3=${{ matrix.prisma }} \
            pnpm.overrides.@prisma/adapter-mariadb=${{ matrix.prisma }}
          pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run integration tests
        env:
          NODE_ENV: test
        run: pnpm --filter @kuruwic/prisma-audit-integration-tests test:all-dbs

      - name: Report compatibility
        if: always()
        run: |
          echo "## Compatibility Report" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js: ${{ matrix.node }}" >> $GITHUB_STEP_SUMMARY
          echo "- Prisma: ${{ matrix.prisma }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
